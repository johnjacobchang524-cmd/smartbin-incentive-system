<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBin Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #203328;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000012;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      color: #176b45;
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68766d;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6ce;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #35a56c;
      border-color: #176b45;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #176b45;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">♻️</div>

    <h1>SmartBin Admin</h1>

    <p class="subtitle">
      Sign in with your authorized administrator account.
    </p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        placeholder="Enter your admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a href="index.html" class="back-link">← Back to Homepage</a>
  </main>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      signOut,
      getDoc,
      doc,
      db
    } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    // This must match the authorized administrator UID
    // configured in your Firestore rules.
    const ADMIN_UID = "ZuAlxDu4n3eUzVCPacqj6t1tgZW2";

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";
      message.textContent = "";
      message.style.color = "#b42318";

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (credential.user.uid !== ADMIN_UID) {
          await signOut(auth);
          throw new Error("This account is not authorized as an administrator.");
        }

        // Verify the signed-in admin can read the student collection.
        await getDoc(doc(db, "STUDENTS", "STU001"));

        message.style.color = "#176b45";
        message.textContent = "Login successful! Opening admin dashboard...";

        window.location.href = "students.html";
      } catch (error) {
        console.error("Admin login error:", error);

        message.style.color = "#b42318";

        if (error.code === "auth/invalid-credential") {
          message.textContent = "Incorrect email or password.";
        } else if (error.code === "permission-denied") {
          message.textContent =
            "Signed in, but database access was denied. Check the Firestore rules and admin UID.";
        } else {
          message.textContent = error.message ||
            "Unable to sign in. Please try again.";
        }
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
