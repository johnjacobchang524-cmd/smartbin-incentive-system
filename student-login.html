<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | SmartBin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        #googleLoginButton {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    margin-top: 12px;
    background: white !important;
    color: #333 !important;
    border: 1px solid #ccc !important;
}

#googleLoginButton:hover {
    background: #f5f5f5 !important;
}

        button:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo">♻️</div>

        <h1>Student Login</h1>
        <p class="subtitle">Trash Bin Incentive System</p>

        <form id="studentLoginForm">
            <label for="studentId">Student ID</label>
            <input
                type="text"
                id="studentId"
                placeholder="e.g. STU001"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Log In</button>
 <button
    type="button"
    id="googleLoginButton"
    style="width:100%; padding:14px; margin-top:12px;
           background:white; color:#333; border:1px solid #ccc;
           border-radius:8px; font-size:16px; font-weight:bold;
           cursor:pointer;"
>
    Continue with Google
</button>
            
<div style="text-align:center; margin:18px 0; color:#777;">
</div>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
    import {
    auth,
    db,
    collection,
    getDocs,
    query,
    where,
    signInWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    signOut
} from "./firebase.js";

    const form = document.getElementById("studentLoginForm");
    const studentIdInput = document.getElementById("studentId");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const googleLoginButton = document.getElementById("googleLoginButton");

googleLoginButton.addEventListener("click", async () => {
    message.textContent = "";
    message.style.color = "#c62828";

    googleLoginButton.disabled = true;
    googleLoginButton.textContent = "Connecting to Google...";

    try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({
            prompt: "select_account"
        });

        // Open Google's account-selection window.
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Find the approved student record linked to this account.
        const studentQuery = query(
            collection(db, "STUDENTS"),
            where("authUid", "==", user.uid)
        );

        const studentSnapshot = await getDocs(studentQuery);

        if (studentSnapshot.empty) {
            await signOut(auth);

            throw new Error(
                "Your Gmail is not linked to an approved student account. Please contact the administrator."
            );
        }

        const studentData = studentSnapshot.docs[0].data();

        // Verify the account email matches the approved student record.
        if (
            !studentData.email ||
            studentData.email.toLowerCase() !== user.email.toLowerCase()
        ) {
            await signOut(auth);

            throw new Error(
                "Your Gmail does not match the email linked to your student account."
            );
        }

        message.style.color = "#2e7d32";
        message.textContent =
            "Google login successful! Opening your dashboard...";

        window.location.href = "student-dashboard.html";

    } catch (error) {
        console.error("Google login error:", error);

        if (error.code === "auth/popup-closed-by-user") {
            message.textContent =
                "Google sign-in was cancelled.";
        } else if (error.code === "auth/popup-blocked") {
            message.textContent =
                "The Google sign-in window was blocked. Allow pop-ups and try again.";
        } else if (
            error.code === "auth/unauthorized-domain"
        ) {
            message.textContent =
                "This website domain is not authorized in Firebase Authentication.";
        } else {
            message.textContent =
                error.message || "Google sign-in failed. Please try again.";
        }
    } 
    
});

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const loginInput = studentIdInput.value.trim();
        const password = passwordInput.value;

        message.textContent = "";
        message.style.color = "#c62828";
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            let email = loginInput;

            // If the user entered a Student ID, find its linked account.
            if (!loginInput.includes("@")) {
                const studentId = loginInput.toUpperCase();

                const studentQuery = query(
                    collection(db, "STUDENTS"),
                    where("studentId", "==", studentId)
                );

                const studentSnapshot = await getDocs(studentQuery);

                if (studentSnapshot.empty) {
                    throw new Error("STUDENT_NOT_FOUND");
                }

                const studentData = studentSnapshot.docs[0].data();

                if (!studentData.authUid || !studentData.email) {
                    throw new Error("ACCOUNT_NOT_LINKED");
                }

                email = studentData.email;
            }

            // Sign in with the real Firebase Authentication email.
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            message.style.color = "#2e7d32";
            message.textContent =
                "Login successful! Opening your dashboard...";

            window.location.href = "student-dashboard.html";

        } catch (error) {
            console.error("Student login error:", error);

            // Make sure a failed login does not leave a user signed in.
            if (auth.currentUser) {
                try {
                    await signOut(auth);
                } catch (signOutError) {
                    console.error(
                        "Sign-out error:",
                        signOutError
                    );
                }
            }

            if (error.message === "STUDENT_NOT_FOUND") {
                message.textContent =
                    "Student ID not found. Please contact the administrator.";
            } else if (error.message === "ACCOUNT_NOT_LINKED") {
                message.textContent =
                    "Your account has not been linked to a student record. Please contact the administrator.";
            } else if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/user-not-found" ||
                error.code === "auth/wrong-password"
            ) {
                message.textContent =
                    "Invalid Student ID/Gmail or password. Please check your credentials.";
            } else if (error.code === "auth/too-many-requests") {
                message.textContent =
                    "Too many login attempts. Please try again later.";
            } else {
                message.textContent =
                    "Login failed: " + error.message;
            }
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Log In";
        }
    });
</script>

</body>
</html>
